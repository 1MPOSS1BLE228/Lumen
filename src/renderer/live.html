<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' blob: data:">
  <title>Lumen Live</title>
  <style>
    :root{--a:#8b5cff;--b:#00e5ff;--font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif}
    html,body{margin:0;height:100%;overflow:hidden;background:#06060b;cursor:default;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased}
    canvas{display:block;width:100vw;height:100vh}
    #w{position:fixed;display:none;flex-direction:column;gap:1.4vh;width:min(28vw,46vh);font-size:1.45vh;pointer-events:none}
    #w.on{display:flex}
    #w.sz-s{transform:scale(.82)}#w.sz-l{transform:scale(1.22)}
    #w.tr{transform-origin:top right}#w.tl{transform-origin:top left}#w.br{transform-origin:bottom right}#w.bl{transform-origin:bottom left}
    #w.tr{top:5vh;right:3vw;align-items:stretch}#w.tl{top:5vh;left:3vw}#w.br{bottom:7vh;right:3vw;flex-direction:column-reverse}#w.bl{bottom:7vh;left:3vw;flex-direction:column-reverse}
    .card{background:rgba(10,10,18,.42);border:1px solid rgba(255,255,255,.09);border-radius:2.2vh;padding:2vh 2.2vh;backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 1.2vh 4vh rgba(0,0,0,.35)}
    .clock.sec .t{font-size:6.4vh}
    .clock .t{font-size:8.2vh;font-weight:250;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .clock .d{margin-top:.8vh;font-size:1.7vh;color:rgba(255,255,255,.72)}
    .clock .d::first-letter{text-transform:uppercase}
    .wx .now{display:flex;align-items:center;gap:1.8vh}
    .wx .now>svg{width:6vh;height:6vh;flex:none}
    .wx .fc{display:grid;grid-template-columns:repeat(3,1fr);gap:1vh;margin-top:1.6vh;padding-top:1.4vh;border-top:1px solid rgba(255,255,255,.08)}
    .wx .fc div{display:grid;grid-template-columns:auto 2.6vh auto auto;align-items:center;gap:.5vh}
    .wx .fc span{color:rgba(255,255,255,.6)}
    .wx .fc svg{width:2.6vh;height:2.6vh}
    .wx .fc i{font-style:normal;color:rgba(255,255,255,.5)}
    .wx .tp{font-size:4.6vh;font-weight:300;line-height:1}
    .wx .tx{color:rgba(255,255,255,.78);margin-top:.4vh}
    .wx .mt{color:rgba(255,255,255,.5);font-size:1.25vh;margin-top:.3vh}
    .wx.err{color:rgba(255,255,255,.6)}
    .sys .r{display:grid;grid-template-columns:9.5em 1fr auto;align-items:center;gap:1.2vh;margin:.55vh 0}
    .sys .l{color:rgba(255,255,255,.7)}
    .sys .v{font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right;white-space:nowrap}
    .bar{height:.6vh;border-radius:1vh;background:rgba(255,255,255,.1);overflow:hidden}
    .bar i{display:block;height:100%;width:0;border-radius:1vh;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s ease}
    body.anim .card{backdrop-filter:none;background:rgba(10,10,18,.58)} /* размытие под анимацией пересчитывалось бы каждый кадр */
    .hot .bar i{background:linear-gradient(90deg,#ffb000,#ff3d3d)}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="w" class="tr" aria-hidden="true">
    <div class="card clock" id="wc"><div class="t" id="ct">--:--</div><div class="d" id="cd"></div></div>
    <div class="card wx" id="ww"></div>
    <div class="card sys" id="ws"></div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="i18n-dom.js"></script>
  <script src="live.js"></script>
</body>
</html>
