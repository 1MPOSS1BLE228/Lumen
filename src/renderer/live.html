<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' blob: data:">
  <title>Lumen Live</title>
  <style>
    :root{--a:#8b5cff;--b:#00e5ff;--font:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif}
    html,body{margin:0;height:100%;overflow:hidden;background:#06060b;cursor:default;font-family:var(--font);color:#fff;-webkit-font-smoothing:antialiased}
    canvas{display:block;width:100vw;height:100vh}
    #w{position:fixed;display:none;flex-direction:column;gap:1.4vh;width:min(28vw,46vh);font-size:1.45vh;pointer-events:none}
    #w.on{display:flex}
    #w.sz-s{transform:scale(.82)}#w.sz-l{transform:scale(1.22)}
    #w.tr{transform-origin:top right}#w.tl{transform-origin:top left}#w.br{transform-origin:bottom right}#w.bl{transform-origin:bottom left}
    #w.tr{top:5vh;right:3vw;align-items:stretch}#w.tl{top:5vh;left:3vw}#w.br{bottom:7vh;right:3vw;flex-direction:column-reverse}#w.bl{bottom:7vh;left:3vw;flex-direction:column-reverse}
    .card{background:rgba(10,10,18,.42);border:1px solid rgba(255,255,255,.09);border-radius:2.2vh;padding:2vh 2.2vh;backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 1.2vh 4vh rgba(0,0,0,.35)}
    .clock.sec .t{font-size:6.4vh}
    .clock .t{font-size:8.2vh;font-weight:250;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
    .clock .d{margin-top:.8vh;font-size:1.7vh;color:rgba(255,255,255,.72)}
    .clock .d::first-letter{text-transform:uppercase}
    .wx .now{display:flex;align-items:center;gap:1.8vh}
    .wx .now>svg{width:6vh;height:6vh;flex:none}
    .wx .fc{display:grid;grid-template-columns:repeat(3,1fr);gap:1vh;margin-top:1.6vh;padding-top:1.4vh;border-top:1px solid rgba(255,255,255,.08)}
    .wx .fc div{display:grid;grid-template-columns:auto 2.6vh auto auto;align-items:center;gap:.5vh}
    .wx .fc span{color:rgba(255,255,255,.6)}
    .wx .fc svg{width:2.6vh;height:2.6vh}
    .wx .fc i{font-style:normal;color:rgba(255,255,255,.5)}
    .wx .tp{font-size:4.6vh;font-weight:300;line-height:1}
    .wx .tx{color:rgba(255,255,255,.78);margin-top:.4vh}
    .wx .mt{color:rgba(255,255,255,.5);font-size:1.25vh;margin-top:.3vh}
    .wx.err{color:rgba(255,255,255,.6)}
    .sys .r{display:grid;grid-template-columns:9.5em 1fr auto;align-items:center;gap:1.2vh;margin:.55vh 0}
    .sys .l{color:rgba(255,255,255,.7)}
    .sys .v{font-variant-numeric:tabular-nums;min-width:5.5em;text-align:right;white-space:nowrap}
    .bar{height:.6vh;border-radius:1vh;background:rgba(255,255,255,.1);overflow:hidden}
    .bar i{display:block;height:100%;width:0;border-radius:1vh;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s ease}
    body.anim .card{backdrop-filter:none;background:rgba(10,10,18,.58)} /* размытие под анимацией пересчитывалось бы каждый кадр */
    .hot .bar i{background:linear-gradient(90deg,#ffb000,#ff3d3d)}
    /* Сейчас играет */
    .mu .top{display:flex;align-items:center;gap:1.6vh}
    .mu .ly{margin-top:1.4vh;padding-top:1.2vh;border-top:1px solid rgba(255,255,255,.08);font-size:1.75vh;line-height:1.35;font-weight:500;color:rgba(255,255,255,.92);min-height:2.4vh}
    .mu .ly.in{animation:lyin .45s ease}
    @keyframes lyin{from{opacity:0;transform:translateY(.6vh)}to{opacity:1;transform:none}}
    #w.st-minimal .mu .ly{border-top-color:rgba(255,255,255,.18)}
    .mu .cv{width:7vh;height:7vh;flex:none;border-radius:1.2vh;background:linear-gradient(135deg,var(--a),var(--b));background-size:cover;background-position:center;box-shadow:0 .6vh 2vh rgba(0,0,0,.35)}
    .mu .tt{font-size:1.9vh;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mu .ar{color:rgba(255,255,255,.65);margin-top:.3vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .mu .ap{color:rgba(255,255,255,.42);font-size:1.15vh;margin-top:.5vh;text-transform:uppercase;letter-spacing:.06em}
    .mu .top>div{min-width:0}
    .mu .ctl{display:flex;justify-content:center;align-items:center;gap:2.2vh;margin-top:1.4vh}
    .mu .cb{width:4.4vh;height:4.4vh;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);transition:background .15s,transform .15s}
    .mu .cb svg{width:2vh;height:2vh;fill:#fff}
    .mu .cb.pp{width:5.4vh;height:5.4vh;background:linear-gradient(135deg,var(--a),var(--b));border:0;box-shadow:0 .6vh 2vh color-mix(in srgb,var(--a) 45%,transparent)}
    .mu .cb.pp svg{width:2.4vh;height:2.4vh}
    .mu .cb.hov{background:rgba(255,255,255,.2);transform:scale(1.08)}
    .mu .cb.pp.hov{filter:brightness(1.15)}
    .mu .cb.prs{animation:prs .35s ease}
    @keyframes prs{40%{transform:scale(.86)}100%{transform:scale(1)}}
    .mu.pz .eq i{animation:none;height:35%}
    .mu .eq{display:inline-flex;gap:.25vh;align-items:flex-end;height:1.2vh;margin-right:.6vh;vertical-align:-.1vh}
    .mu .eq i{width:.35vh;background:var(--a);border-radius:.2vh;animation:eq 1s ease-in-out infinite}
    .mu .eq i:nth-child(2){animation-delay:-.4s}.mu .eq i:nth-child(3){animation-delay:-.7s}
    @keyframes eq{0%,100%{height:30%}50%{height:100%}}
    body.paused .mu .eq i{animation:none}
    /* Календарь */
    .cal .mh{font-weight:600;margin-bottom:1vh}
    .cal .mh::first-letter{text-transform:uppercase}
    .cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:.4vh;text-align:center;font-variant-numeric:tabular-nums}
    .cal .g span{padding:.45vh 0;border-radius:.8vh;font-size:1.3vh}
    .cal .g .h{color:rgba(255,255,255,.45);font-size:1.1vh;text-transform:uppercase}
    .cal .g .o{color:rgba(255,255,255,.28)}
    .cal .g .we{color:rgba(255,255,255,.6)}
    .cal .g .td{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-weight:700}
    /* Заметка */
    .note{font-size:1.9vh;line-height:1.35;white-space:pre-wrap;word-break:break-word}
    /* Стиль: стекло (по умолчанию), плотный, без подложки, неон */
    #w.op-low .card{background:rgba(10,10,18,.22)}#w.op-high .card{background:rgba(10,10,18,.7)}
    #w.st-solid .card{background:rgba(16,16,26,.9);backdrop-filter:none;border-color:rgba(255,255,255,.06)}
    #w.st-solid.op-low .card{background:rgba(16,16,26,.72)}#w.st-solid.op-high .card{background:rgba(16,16,26,.97)}
    #w.st-minimal .card{background:none;border:0;box-shadow:none;backdrop-filter:none;padding:.6vh 0;text-shadow:0 .2vh 1.2vh rgba(0,0,0,.65)}
    #w.st-minimal .wx .fc{border-top-color:rgba(255,255,255,.18)}
    #w.st-neon .card{border:1px solid color-mix(in srgb,var(--a) 70%,transparent);box-shadow:0 0 2.4vh color-mix(in srgb,var(--a) 40%,transparent),inset 0 0 2vh color-mix(in srgb,var(--b) 14%,transparent)}
    #w.st-neon .clock .t{text-shadow:0 0 2vh color-mix(in srgb,var(--a) 75%,transparent)}
    /* Часы: тонкие, жирные, моноширинные */
    #w.ck-bold .clock .t{font-weight:800;letter-spacing:-.03em}
    #w.ck-mono .clock .t{font-family:"Cascadia Mono","Consolas",ui-monospace,monospace;font-weight:400;letter-spacing:-.04em}
    /* Акценты белым вместо цветов темы */
    #w.ac-white{--a:#ffffff;--b:#cfd3ff}
    #w.ac-white .bar i{background:rgba(255,255,255,.85)}
    #w.ac-white .mu .cb.pp svg{fill:#14121f}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="w" class="tr" aria-hidden="true">
    <div class="card clock" id="wc"><div class="t" id="ct">--:--</div><div class="d" id="cd"></div></div>
    <div class="card wx" id="ww"></div>
    <div class="card sys" id="ws"></div>
    <div class="card mu" id="wm"></div>
    <div class="card cal" id="wk"></div>
    <div class="card note" id="wn"></div>
  </div>
  <script src="../shared/i18n.js"></script>
  <script src="i18n-dom.js"></script>
  <script src="live.js"></script>
</body>
</html>
