<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070c">
<title>Lumen</title>
<style>
  :root{--bg:#07070c;--panel:#12121c;--line:rgba(255,255,255,.08);--text:#f2f2f8;--dim:#8d8ca8;--a:#8b5cff;--b:#00e5ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif}
  body{padding:max(18px,env(safe-area-inset-top)) 16px 28px}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  h1{font-size:22px;margin:0;letter-spacing:.02em}
  .sub{color:var(--dim);font-size:13px;margin-top:2px}
  .pw{width:64px;height:64px;border-radius:50%;border:0;background:#1d1d2a;color:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
  .pw.on{background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 30px -6px var(--a)}
  .pw svg{width:28px;height:28px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--dim);font-size:14px}
  .row b{color:var(--text);font-weight:600}
  input[type=range]{width:100%;height:36px;accent-color:var(--a)}
  .btn{width:100%;padding:15px;border-radius:14px;border:1px solid var(--line);background:#1a1a27;color:var(--text);font-size:16px;font-weight:600;margin-bottom:14px}
  h2{font-size:15px;color:var(--dim);font-weight:600;margin:6px 2px 10px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .th{border-radius:14px;border:2px solid transparent;overflow:hidden;background:var(--panel);padding:0;color:var(--text);text-align:left}
  .th .g{height:46px}
  .th span{display:block;padding:9px 11px;font-size:14px;font-weight:600}
  .th.on{border-color:#fff}
  .err{color:#ffb454;text-align:center;padding:30px 10px}
</style>
</head>
<body>
<header><div><h1>Lumen</h1><div class="sub" id="cur"></div></div>
<button class="pw" id="pw" aria-label="__POWER__"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 7.2a8 8 0 1 0 11.4 0"/></svg></button></header>
<div class="card"><div class="row"><span>__BRIGHT__</span><b id="bv"></b></div><input type="range" id="br" min="0" max="100"></div>
<div class="card"><div class="row"><span>__SPEED__</span><b id="sv"></b></div><input type="range" id="sp" min="1" max="100"></div>
<button class="btn" id="sur">🎲 __SURPRISE__</button>
<h2>__THEMES__</h2>
<div class="grid" id="th"></div>
<div class="err" id="err" hidden>__LOST__</div>
<script>
(() => {
  const key = new URLSearchParams(location.search).get('t');
  const $ = (id) => document.getElementById(id);
  let S = null, busy = 0;
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function draw() {
    if (!S) return;
    $('pw').classList.toggle('on', S.power);
    if (!busy) { $('br').value = S.brightness; $('sp').value = S.speed; }
    $('bv').textContent = $('br').value + '%';
    $('sv').textContent = $('sp').value + '%';
    $('cur').textContent = S.themeName || '';
    const c = S.colors || [];
    document.documentElement.style.setProperty('--a', c[0] || '#8b5cff');
    document.documentElement.style.setProperty('--b', c[c.length - 1] || '#00e5ff');
    $('th').innerHTML = S.themes.map((t) => `<button class="th${t.id === S.themeId ? ' on' : ''}" data-id="${esc(t.id)}"><div class="g" style="background:linear-gradient(90deg,${t.colors.map(esc).join(',')})"></div><span>${esc(t.name)}</span></button>`).join('');
  }
  async function load() {
    try { const r = await fetch('/api/state?t=' + encodeURIComponent(key)); S = await r.json(); $('err').hidden = true; draw(); }
    catch (_) { $('err').hidden = false; }
  }
  async function act(cmd) {
    try {
      const r = await fetch('/api/act?t=' + encodeURIComponent(key), { method: 'POST', body: JSON.stringify(cmd) });
      const j = await r.json(); S = j.state; draw();
    } catch (_) { $('err').hidden = false; }
  }
  $('pw').onclick = () => act({ power: !S.power });
  $('sur').onclick = () => act({ surprise: true });
  $('th').onclick = (e) => { const b = e.target.closest('.th'); if (b) act({ theme: b.dataset.id }); };
  for (const [id, k] of [['br', 'brightness'], ['sp', 'speed']]) {
    let tm = null;
    $(id).oninput = () => { busy++; draw(); clearTimeout(tm); tm = setTimeout(() => { act({ [k]: Number($(id).value) }).finally(() => { busy = Math.max(0, busy - 1); }); }, 120); };
    $(id).onchange = () => { busy = 0; };
  }
  load();
  setInterval(() => { if (!document.hidden && !busy) load(); }, 3000);
})();
</script>
</body>
</html>
